<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bengali Keyboard</title>
    <style>
        :root {
            --bg: #fff;
            --ink: #1d2523;
            --mute: #7a8683;
            --line: #cfd6d3;
            --acc: #0b6b5a;
            --accbg: #e6f3ef
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #161e1c;
                --ink: #e6eeeb;
                --mute: #8da09b;
                --line: #2f413d;
                --acc: #4fc3a8;
                --accbg: #1f3a34
            }
        }

        html, body {
            margin: 0;
            height: 100%;
            background: var(--bg);
            color: var(--ink)
        }

        #ed {
            position: fixed;
            inset: 0;
            overflow: auto;
            padding: 40px 22px 18px;
            outline: none;
            box-sizing: border-box;
            font: 14px/1.8 "Noto Sans Bengali", "Kalpurush", system-ui, sans-serif;
            white-space: pre-wrap;
            word-break: break-word
        }

        #bar {
            position: fixed;
            top: 8px;
            right: 16px;
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 10px;
            font: 12px system-ui, sans-serif;
            color: var(--mute)
        }

        .btn {
            font: inherit;
            font-size: 13px;
            padding: 4px 14px;
            border: 1px solid var(--acc);
            border-radius: 6px;
            background: var(--bg);
            color: var(--acc);
            cursor: pointer
        }

        .btn:hover {
            background: var(--acc);
            color: var(--bg)
        }

        #ed:empty::before {
            content: attr(data-ph);
            color: var(--mute)
        }

        #ed::after {
            content: "\200b"
        }

        /* lets a trailing newline show an empty last line */
        .comp {
            background: var(--accbg);
            border-bottom: 2px solid var(--acc)
        }

        #pop {
            position: fixed;
            z-index: 10;
            min-width: 130px;
            max-width: 90vw;
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 6px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, .18);
            font: 14px/1.4 "Noto Sans Bengali", system-ui, sans-serif
        }

        #pop[hidden] {
            display: none
        }

        /* the typed Roman letters, pinned above the scrolling list */
        #typed {
            padding: 5px 10px;
            border-bottom: 1px solid var(--line);
            background: var(--accbg);
            color: var(--acc);
            font: 600 14px ui-monospace, Menlo, Consolas, monospace;
            letter-spacing: .3px;
            overflow-wrap: anywhere
        }

        #cand {
            list-style: none;
            margin: 0;
            padding: 3px;
            max-height: 238px;
            overflow: auto
        }

        #cand li {
            padding: 3px 10px;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap
        }

        #cand li.sel {
            background: var(--acc);
            color: #fff
        }

        #pop .hint {
            padding: 3px 10px;
            border-top: 1px solid var(--line);
            color: var(--mute);
            font-size: 11px
        }

        /* typing guideline popup */
        #guide {
            width: min(1040px, 95vw);
            height: min(88vh, 800px);
            padding: 0;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--bg);
            color: var(--ink);
            box-shadow: 0 12px 40px rgba(0, 0, 0, .35)
        }

        #guide[open] {
            display: flex;
            flex-direction: column
        }

        #guide::backdrop {
            background: rgba(0, 0, 0, .45)
        }

        .gh {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 10px 16px;
            border-bottom: 1px solid var(--line)
        }

        .gh h2 {
            margin: 0;
            font: 600 16px system-ui, sans-serif
        }

        #gnav {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            flex: 1
        }

        #gnav button {
            font: 12px system-ui, sans-serif;
            padding: 2px 10px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--bg);
            color: var(--ink);
            cursor: pointer
        }

        #gnav button:hover {
            border-color: var(--acc);
            color: var(--acc)
        }

        .gb {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: 14px 16px 20px;
            display: grid;
            grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
            gap: 14px;
            align-content: start
        }

        .gnote {
            grid-column: 1/-1;
            margin: 0;
            color: var(--mute);
            font: 13px/1.5 system-ui, sans-serif
        }

        .gc {
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 12px;
            min-width: 0
        }

        .gc.wide {
            grid-column: 1/-1
        }

        .gc h3 {
            margin: 0 0 8px;
            font: 600 13px system-ui, sans-serif
        }

        .gt {
            display: flex;
            gap: 18px;
            flex-wrap: wrap
        }

        .gt table {
            border-collapse: collapse;
            flex: 1 1 260px;
            font: 13px system-ui, sans-serif
        }

        .gt th {
            text-align: left;
            font-weight: 600;
            color: var(--mute);
            padding: 2px 8px 4px 0;
            border-bottom: 1px solid var(--line)
        }

        .gt td {
            padding: 2px 8px 2px 0;
            border-bottom: 1px solid var(--line);
            vertical-align: top
        }

        .gt td.bn {
            font: 16px "Noto Sans Bengali", "Kalpurush", sans-serif;
            white-space: nowrap
        }

        .gt td.key {
            font: 13px ui-monospace, Menlo, Consolas, monospace;
            color: var(--acc);
            white-space: nowrap
        }
    </style>
</head>
<body>
<div id="ed" contenteditable="true" spellcheck="false" autofocus
     data-ph="Type phonetically, e.g.  ami bhalo achi   (↑ ↓ to choose, Space/Enter to confirm)"></div>
<div id="bar">
    <span id="status"></span>
    <button id="guideBtn" class="btn" type="button" title="Typing guideline">Guide</button>
    <button id="save" class="btn" type="button" title="Save (Ctrl+S)">Save</button>
</div>
<dialog id="guide" aria-labelledby="guideTitle">
    <div class="gh">
        <h2 id="guideTitle">Typing guideline</h2>
        <nav id="gnav"></nav>
        <button id="gclose" class="btn" type="button">Close ✕</button>
    </div>
    <div class="gb" id="gbody"></div>
</dialog>
<div id="pop" hidden>
    <div id="typed" aria-label="Typed letters"></div>
    <ul id="cand" role="listbox"></ul>
    <div class="hint">↑ ↓ choose · Space / Enter confirm · Esc keep Roman</div>
</div>
<script>
    const $ = id => document.getElementById(id);
    const ed = $('ed'), pop = $('pop'), cand = $('cand'), typedEl = $('typed');
    ed.contentEditable = 'plaintext-only';
    if (ed.contentEditable !== 'plaintext-only') ed.contentEditable = 'true';

    const cache = {};                      // roman word -> candidate list (from the Spring Boot API)
    let roman = '';                        // letters of the ACTIVE word (kept in sync with key presses)
    let comp = null;                       // {span, list, sel, moved, key} while a word is active

    // Remembered choices: roman word -> chosen Bengali word
    let prefs = {};
    try {
        prefs = JSON.parse(localStorage.getItem('bnPrefs') || '{}');
    } catch (e) {
    }
    const savePrefs = () => {
        try {
            localStorage.setItem('bnPrefs', JSON.stringify(prefs));
        } catch (e) {
        }
    };

    async function fetchC(w) {
        if (!cache[w]) cache[w] = (await (await fetch('/api/candidates?word=' + encodeURIComponent(w))).json()).candidates;
    }

    const listFor = w => (prefs[w] && !cache[w].includes(prefs[w])) ? [prefs[w], ...cache[w]] : cache[w];

    /* ---------- caret helpers ---------- */
    function setCaret(range) {
        const s = getSelection();
        s.removeAllRanges();
        s.addRange(range);
    }

    function setCaretOffset(off) {                         // caret at a character offset of the whole text
        const w = document.createTreeWalker(ed, NodeFilter.SHOW_TEXT);
        let n, acc = 0;
        while ((n = w.nextNode())) {
            if (acc + n.length >= off) {
                const r = document.createRange();
                r.setStart(n, off - acc);
                r.collapse(true);
                return setCaret(r);
            }
            acc += n.length;
        }
        const r = document.createRange();
        r.selectNodeContents(ed);
        r.collapse(false);
        setCaret(r);
    }

    function insertText(t) {                               // plain insertion at the caret, replaces a selection
        const s = getSelection();
        let r = s.rangeCount && ed.contains(s.getRangeAt(0).startContainer) ? s.getRangeAt(0) : null;
        if (!r) {
            r = document.createRange();
            r.selectNodeContents(ed);
            r.collapse(false);
        }
        r.deleteContents();
        const n = document.createTextNode(t);
        r.insertNode(n);
        const off = (() => {
            const q = document.createRange();
            q.selectNodeContents(ed);
            q.setEnd(n, n.length);
            return q.toString().length;
        })();
        ed.normalize();
        setCaretOffset(off);
    }

    /* ---------- the active word ---------- */
    function startComp() {
        const s = getSelection();
        let r = s.rangeCount ? s.getRangeAt(0) : null;
        if (!r || !ed.contains(r.startContainer)) {
            r = document.createRange();
            r.selectNodeContents(ed);
            r.collapse(false);
        }
        if (!r.collapsed) r.deleteContents();                // typing over a selection replaces it
        const span = document.createElement('span');
        span.className = 'comp';
        r.insertNode(span);
        comp = {span, list: [], sel: 0, moved: false, key: null};
    }

    function setSpan(text) {
        comp.span.textContent = text;
        const r = document.createRange();
        r.selectNodeContents(comp.span);
        r.collapse(false);
        setCaret(r);
    }

    function refresh() {
        const w = roman, c = cache[w];
        if (!c) {                                            // not loaded yet: show the letters, fetch in the background
            comp.list = [];
            comp.key = null;
            setSpan(w);
            drawPop();
            fetchC(w).then(() => {
                if (comp && roman === w) refresh();
            }).catch(() => {
            });
            return;
        }
        if (comp.key !== w) {                                // new word text: start from the remembered choice
            comp.key = w;
            comp.list = listFor(w);
            comp.sel = prefs[w] ? Math.max(0, comp.list.indexOf(prefs[w])) : 0;
            comp.moved = false;
        }
        setSpan(comp.list[comp.sel]);
        drawPop();
    }

    function move(d) {
        if (!comp.list.length) return;
        comp.sel = (comp.sel + d + comp.list.length) % comp.list.length;
        comp.moved = true;
        setSpan(comp.list[comp.sel]);
        drawPop();
    }

    function commit(text) {                                // resolve the active word into plain text
        if (!comp) return;
        const w = roman;
        const t = text ?? (comp.list.length ? comp.list[comp.sel] : w);
        if (text === undefined && comp.moved && comp.list.length) {
            prefs[w] = t;
            savePrefs();
        }   // remember a deliberate pick
        const tn = document.createTextNode(t);
        comp.span.replaceWith(tn);
        const q = document.createRange();
        q.selectNodeContents(ed);
        q.setEnd(tn, tn.length);
        const off = q.toString().length;
        ed.normalize();
        setCaretOffset(off);
        comp = null;
        roman = '';
        pop.hidden = true;
    }

    async function finish(ch) {                            // Space / Enter / full stop: resolve, then type the character
        const w = roman;
        if (!cache[w]) {
            try {
                await fetchC(w);
            } catch (e) {
            }
        }
        if (!comp) return;
        refresh();
        commit();
        insertText(ch);
    }

    /* ---------- suggestion popup ---------- */
    function drawPop() {
        if (!comp || !comp.list.length) {
            pop.hidden = true;
            return;
        }
        cand.replaceChildren(...comp.list.map((c, i) => {
            const li = document.createElement('li');
            li.textContent = c;
            if (i === comp.sel) li.className = 'sel';
            li.onmousedown = e => {
                e.preventDefault();
                comp.sel = i;
                comp.moved = true;
                commit();
            };
            return li;
        }));
        typedEl.textContent = roman;                           // the Roman letters you typed, always visible
        pop.hidden = false;
        const rs = comp.span.getClientRects(), r = rs.length ? rs[rs.length - 1] : comp.span.getBoundingClientRect();
        pop.style.left = Math.max(4, Math.min(r.left, innerWidth - pop.offsetWidth - 8)) + 'px';
        let top = r.bottom + 4;
        if (top + pop.offsetHeight > innerHeight - 8) top = Math.max(8, r.top - pop.offsetHeight - 4);
        pop.style.top = top + 'px';
        const el = cand.children[comp.sel];
        if (el) el.scrollIntoView({block: 'nearest'});
    }

    ed.addEventListener('scroll', () => comp && drawPop());

    /* ---------- keyboard ---------- */
    ed.addEventListener('keydown', e => {
        if (e.isComposing || e.key === 'Process') return;
        const mod = e.ctrlKey || e.metaKey || e.altKey;
        if (!mod && /^[A-Za-z`]$/.test(e.key)) {             // a phonetic letter: goes into the active word
            e.preventDefault();
            if (!comp) startComp();
            roman += e.key;
            refresh();
            return;
        }
        if (!mod && /^[0-9]$/.test(e.key)) {                 // digits become Bengali digits (০-৯); paste is never converted
            e.preventDefault();
            const d = '০১২৩৪৫৬৭৮৯'[+e.key];
            if (comp) finish(d); else insertText(d);           // resolve the active word first, if any
            return;
        }
        if (!mod && comp && /^[\^:]$/.test(e.key)) {         // ^ = chandrabindu, : = visarga, inside a word only
            e.preventDefault();
            roman += e.key;
            refresh();
            return;
        }
        if (!comp) {                                         // no active word: normal editing (Backspace, arrows, Delete...)
            if (e.key === 'Enter' && !mod) {
                e.preventDefault();
                insertText('\n');
            }
            return;
        }
        switch (e.key) {
            case 'Shift':
            case 'Control':
            case 'Alt':
            case 'Meta':
            case 'CapsLock':
                return;
            case 'ArrowDown':
                e.preventDefault();
                move(1);
                return;
            case 'ArrowUp':
                e.preventDefault();
                move(-1);
                return;
            case 'Backspace':                                  // inside the active word: drop one Roman letter
                e.preventDefault();
                roman = roman.slice(0, -1);
                if (!roman) commit(''); else {
                    comp.key = null;
                    refresh();
                }
                return;
            case 'Escape':
                e.preventDefault();
                commit(roman);
                return;      // keep the Roman letters
            case ' ':
                e.preventDefault();
                finish(' ');
                return;
            case 'Enter':
                e.preventDefault();
                finish('\n');
                return;
            case '.':
                e.preventDefault();
                finish('।');
                return;
            default:
                commit();                                 // any other key resolves the word, then does its normal job
        }
    });

    /* ---------- paste, mouse, focus: no conversion at all ---------- */
    ed.addEventListener('paste', e => {
        e.preventDefault();
        if (comp) commit();
        insertText((e.clipboardData || window.clipboardData).getData('text/plain'));   // exactly as copied, any language
    });
    ed.addEventListener('mousedown', () => commit());
    ed.addEventListener('blur', () => commit());

    /* ---------- typing guideline popup ---------- */
    const GUIDE_NOTE = 'Input is case-sensitive (T ≠ t, N ≠ n, S ≠ s, …). Where several keys are listed, the first one is the primary key. For vowels with two outputs, the first is the default and the second is the alternate suggestion.';
    const GUIDE = [
        {
            nav: 'Vowels', title: '1. Independent vowels (word start, or after another vowel)',
            cols: ['Bengali', 'English key', 'Alternate', 'Notes'], kinds: ['bn', 'key', 'txt', 'txt'], rows: [
                ['অ', 'o', '', 'default for o'], ['আ', 'a', 'o → অ', ''], ['য়া', 'a', '', ''],
                ['ই', 'i', '', 'alternate: ঈ'], ['ঈ', 'I, ee', '', 'alternate: ই'],
                ['উ', 'u', '', 'alternate: ঊ'], ['ঊ', 'oo', '', 'alternate: উ'],
                ['ঋ', 'rri, Ri', '', ''], ['এ', 'e', '', ''], ['ঐ', 'oi', '', ''],
                ['ও', 'O', 'o (alternate)', ''], ['ঔ', 'ou', '', '']]
        },
        {
            nav: 'Vowel signs', title: '2. Vowel signs (কার) after a consonant',
            cols: ['Bengali', 'English key', 'Alternate', 'Notes'], kinds: ['bn', 'key', 'txt', 'txt'], rows: [
                ['(inherent vowel, none)', 'o', 'ো', 'first option for o is empty'], ['া', 'a', '', ''],
                ['ি', 'i', 'ী', ''], ['ী', 'I, ee', 'ি', ''], ['ু', 'u', 'ূ', ''], ['ূ', 'oo', 'ু, ও, ৌ', ''],
                ['ৃ', 'rri, Ri', '', ''], ['ে', 'e', '', ''], ['ৈ', 'oi', 'ই, োই', ''],
                ['ো', 'O', 'o (alternate)', ''], ['ৌ', 'ou', 'উ, োউ', '']]
        },
        {
            nav: 'Consonants', title: '3. Consonants', wide: true, split: 3,
            cols: ['Bengali', 'English key', 'Notes'], kinds: ['bn', 'key', 'txt'], rows: [
                ['ক', 'k', ''], ['খ', 'kh', ''], ['গ', 'g', ''], ['ঘ', 'gh', ''], ['ঙ', 'Ng', ''], ['চ', 'c', ''],
                ['ছ', 'ch', ''], ['জ', 'j', 'also reachable from z (see §6)'], ['ঝ', 'jh', ''], ['ঞ', 'NG', ''],
                ['ট', 'T', ''], ['ঠ', 'Th', ''], ['ড', 'D', ''], ['ঢ', 'Dh', ''], ['ণ', 'N', ''], ['ত', 't', ''],
                ['থ', 'th', ''], ['দ', 'd', ''], ['ধ', 'dh', ''], ['ন', 'n', ''], ['প', 'p', ''], ['ফ', 'ph, f', ''],
                ['ব', 'b', ''], ['ভ', 'bh, v', ''], ['ম', 'm', ''], ['য', 'z', 'also reachable from j (see §6)'],
                ['র', 'r', ''], ['ল', 'l', ''], ['শ', 'sh', ''], ['ষ', 'S', ''], ['স', 's', ''], ['হ', 'h', ''],
                ['ড়', 'r', 'no direct key; matched via the r / rh group (see §6)'], ['ঢ়', 'rh', ''], ['য়', 'y', ''],
                ['ৎ', 't`', 'khanda-ta (backtick after t)'], ['ক্স', 'x', '']]
        },
        {
            nav: 'Signs', title: '4. Signs and punctuation',
            cols: ['Bengali', 'English key', 'Name'], kinds: ['bn', 'key', 'txt'], rows: [
                ['ং', 'ng', 'অনুস্বার'], ['ঃ', ':', 'বিসর্গ'], ['ঁ', '^', 'চন্দ্রবিন্দু'], ['।', '.', 'দাঁড়ি']]
        },
        {
            nav: 'Conjuncts', title: '5. Conjuncts (যুক্তবর্ণ) with a direct key',
            cols: ['Bengali', 'English key'], kinds: ['bn', 'key'], rows: [
                ['ক্ক', 'kk'], ['ক্ষ', 'ksh, kkh'], ['ঙ্ক', 'ngk'], ['ঙ্খ', 'ngkh'], ['ঙ্গ', 'ngg'], ['ঙ্ঘ', 'nggh'],
                ['চ্চ', 'cc'], ['জ্ঞ', 'gg'], ['ঞ্চ', 'nc'], ['ঞ্ছ', 'nch'], ['ঞ্জ', 'nj'], ['ঞ্ঝ', 'njh'],
                ['ত্থ', 'tth'], ['ত্ম', 'tt'], ['দ্দ', 'dd'], ['ন্ন', 'nn'], ['প্প', 'pp'], ['ব্ব', 'bb'],
                ['ভ্য', 'vv'], ['ম্ম', 'mm'], ['ল্ল', 'll'], ['শ্ব', 'ss']]
        },
        {
            nav: 'Equivalents',
            title: '6. Equivalence groups (Bengali letters that share an English key)',
            wide: true,
            split: 2,
            cols: ['Bengali forms', 'English key(s)'],
            kinds: ['bn', 'key'],
            rows: [
                ['ক্ক, ক্ব, ক্য', 'kk'], ['ক্ষ, খ্য, ক্ষ্য', 'kkh'], ['খ, ক্ষ', 'kh'], ['ঙ্ক, ংক', 'nk, ngk'],
                ['ঙ্খ, ংখ, ংখ্য, ঙ্ক্ষ', 'nkh, ngkh'], ['ঙ্গ, ংগ', 'ngg'], ['ঙ্ঘ, ংঘ', 'nggh'], ['চ্চ, চ্য', 'cc'], ['চ্ছ', 'cch'],
                ['জ, য', 'j, z'], ['জ্ঞ, গ্গ, গ্য, গ্ম', 'gg'], ['ঞ, ঙ', 'NG'], ['ঞ্চ, ন্চ', 'nc'], ['ঞ্ছ, ন্ছ', 'nch'],
                ['ঞ্জ, ন্জ', 'nj'], ['ঞ্ঝ, ন্ঝ', 'njh'], ['ত, ট', 't'], ['ত্থ, থ্য, ঠ্য', 'tth'],
                ['ত্ত, ত্ম, ত্ব, ত্য, ট্ট, ট্য, ত্ত্ব', 'tt'], ['থ, ঠ', 'th'], ['দ, ড, দ্ব', 'd'],
                ['দ্দ, ড্ড, দ্য, দ্ব, ড্য', 'dd'], ['দ্ধ, ধ্য, ঢ্য', 'ddh'], ['ধ, ঢ', 'dh'], ['ন, ণ', 'n'], ['ন্ধ, ন্ধ্য', 'ndh'],
                ['ন্ন, ন্ব, ন্য, ণ্য', 'nn'], ['প্প, প্য', 'pp'], ['ব্ব, ব্য', 'bb'], ['ম্ম, ম্য', 'mm'],
                ['য়, য', 'y'], ['র, ড়, ঢ়', 'r, rh'], ['ল্ল, ল্য', 'll'], ['শ্ব, শ্ম, স্ম, স্ব', 'ss'], ['স, শ, ষ', 's, sh']]
        },
        {
            nav: 'Special words', title: 'Some special words',
            cols: ['Bengali word', 'English keys'], kinds: ['bn', 'key'], rows: [
                ['পাঁচ', 'pac, pach'], ['তাঁর', 'tar'], ['তাঁরা', 'tara'], ['চাঁদ', 'cad, chad'], ['জ্ঞান', 'gyan, gnan, jnan'],
                ['মিঞা', 'mia, miya'], ['ভূঁইয়া', 'vuia, vuiya, bhuia, bhuiya'], ['জ্যোৎস্না', 'josna, josona, jochna, jochona'],
                ['স্মরণ', 'soron'], ['স্বাধীন', 'sadhin'], ['স্বাধীনতা', 'sadhinota'], ['শ্মশান', 'sosan'],
                ['স্মৃতি', 'sriti'], ['সংগ্রাম', 'songram, sonram'], ['ব্যক্তি', 'bakti, bykti'], ['ব্যর্থ', 'barth, byrth']]
        },
        {
            nav: 'Examples', title: 'Examples',
            cols: ['Typing', 'Result'], kinds: ['key', 'bn'], rows: [
                ['ami', 'আমি'], ['bhalo', 'ভালো'], ['kk', 'ক্ক'], ['ngk', 'ঙ্ক'], ['ng', 'ং']]
        }
    ];

    function mk(tag, cls, text) {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text != null) e.textContent = text;
        return e;
    }

    function guideTable(sec, rows) {
        const t = mk('table'), head = mk('thead'), hr = mk('tr');
        sec.cols.forEach(c => hr.append(mk('th', null, c)));
        head.append(hr);
        t.append(head);
        const tb = mk('tbody');
        rows.forEach(r => {
            const tr = mk('tr');
            r.forEach((c, i) => tr.append(mk('td', sec.kinds[i] === 'txt' ? null : sec.kinds[i], c)));
            tb.append(tr);
        });
        t.append(tb);
        return t;
    }

    function buildGuide() {                                    // built once, the first time it is opened
        const body = $('gbody'), nav = $('gnav');
        body.append(mk('p', 'gnote', GUIDE_NOTE));
        GUIDE.forEach(sec => {
            const card = mk('section', 'gc' + (sec.wide ? ' wide' : ''));
            card.append(mk('h3', null, sec.title));
            const wrap = mk('div', 'gt'), n = sec.split || 1, per = Math.ceil(sec.rows.length / n);
            for (let i = 0; i < sec.rows.length; i += per) wrap.append(guideTable(sec, sec.rows.slice(i, i + per)));
            card.append(wrap);
            body.append(card);
            const b = mk('button', null, sec.nav);
            b.type = 'button';
            b.onclick = () => card.scrollIntoView({behavior: 'smooth', block: 'start'});   // jump chips
            nav.append(b);
        });
    }

    const guide = $('guide');
    let guideBuilt = false, guideCaret = null;

    function openGuide() {
        commit();                                                // resolve the active word first
        const s = getSelection();
        guideCaret = null;
        if (s.rangeCount && ed.contains(s.anchorNode)) {         // remember the caret to restore it afterwards
            const r = s.getRangeAt(0), q = document.createRange();
            q.selectNodeContents(ed);
            q.setEnd(r.startContainer, r.startOffset);
            guideCaret = q.toString().length;
        }
        if (!guideBuilt) {
            buildGuide();
            guideBuilt = true;
        }
        guide.showModal();
        $('gbody').scrollTop = 0;
    }

    $('guideBtn').addEventListener('mousedown', e => e.preventDefault());
    $('guideBtn').addEventListener('click', openGuide);
    $('gclose').addEventListener('click', () => guide.close());
    guide.addEventListener('click', e => {
        if (e.target === guide) guide.close();
    });   // click outside the window
    guide.addEventListener('close', () => {                    // Esc, Close button or outside click
        ed.focus();
        if (guideCaret !== null) setCaretOffset(guideCaret);
    });

    /* ---------- save / restore (localStorage) ---------- */
    const DOC_KEY = 'bnDoc', AUTOSAVE_MS = 2 * 60 * 1000;
    const statusEl = $('status');
    let dirty = false;

    function save() {
        try {
            localStorage.setItem(DOC_KEY, ed.textContent);               // the full text, exactly as it is now
            dirty = false;
            statusEl.textContent = 'Saved ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
        } catch (e) {
            statusEl.textContent = 'Could not save (storage full or blocked)';
        }
    }

    // Any change to the text (typing, the active word, paste, delete) just raises a flag; nothing is read or written here
    const watcher = new MutationObserver(() => {
        if (!dirty) {
            dirty = true;
            statusEl.textContent = 'Unsaved changes';
        }
    });
    watcher.observe(ed, {childList: true, characterData: true, subtree: true});

    // Restore the last saved text when the page opens
    try {
        const saved = localStorage.getItem(DOC_KEY);
        if (saved) {
            ed.textContent = saved;
            watcher.takeRecords();                                       // loading is not an edit
            dirty = false;
            statusEl.textContent = 'Restored';
        }
    } catch (e) {
    }

    $('save').addEventListener('mousedown', e => e.preventDefault()); // keep the caret and the active word where they are
    $('save').addEventListener('click', save);
    document.addEventListener('keydown', e => {                      // Ctrl/Cmd+S
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            save();
        }
    });
    setInterval(() => {
        if (dirty) save();
    }, AUTOSAVE_MS);          // every 2 minutes, only if something changed
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && dirty) save();
    });  // tab hidden or closed
    window.addEventListener('pagehide', () => {
        if (dirty) save();
    });

    ed.focus();
    setCaretOffset(ed.textContent.length);                           // caret at the end of the restored text
    ed.scrollTop = ed.scrollHeight;
</script>
</body>
</html>
